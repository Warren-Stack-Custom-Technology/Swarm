name: Build and release
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: version
        name: Read release version
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/package_release.py
      - name: Verify the Windows updater manifest
        shell: pwsh
        run: ./release/Swarm-Standalone/Apply-Update.ps1 -VerifyOnly
      - uses: actions/upload-artifact@v4
        with:
          name: Swarm-${{ steps.version.outputs.version }}
          path: artifacts/Swarm-${{ steps.version.outputs.version }}.*
  publish:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Swarm-${{ needs.verify.outputs.version }}
          path: artifacts
      - name: Publish verified release from merged main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          MERGED_COMMIT: ${{ github.sha }}
          SWARM_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          release_tag="v${SWARM_VERSION}"
          if [ "$EVENT_NAME" = release ]; then
            gh release upload "$EVENT_RELEASE_TAG" "artifacts/Swarm-${SWARM_VERSION}.zip" "artifacts/Swarm-${SWARM_VERSION}.sha256" --clobber
          elif gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; leaving published files unchanged."
          else
            awk -v version="$SWARM_VERSION" '$0 == "## " version { capture=1; next } capture && /^## / {exit} capture {print}' CHANGELOG.md > "$RUNNER_TEMP/swarm-notes.md"
            printf '\nBuilt and verified from merged commit %s.\n' "$MERGED_COMMIT" >> "$RUNNER_TEMP/swarm-notes.md"
            gh release create "$release_tag" "artifacts/Swarm-${SWARM_VERSION}.zip" "artifacts/Swarm-${SWARM_VERSION}.sha256" --target "$MERGED_COMMIT" --title "Swarm ${SWARM_VERSION}" --notes-file "$RUNNER_TEMP/swarm-notes.md"
          fi
